# recording one at your request appends "# recorded by agent on owner's request"
# (intents/README.md → "Recording a gate"); live_checked is always yours.
intent_accepted: 2026-11-03     # recorded by agent on owner's request
spec_accepted: 2026-11-03       # recorded by agent on owner's request
plan_approved: 2026-11-03       # recorded by agent on owner's request
live_checked:            # only when review.md says live-check: owed — the day you ran it yourself
merged:                  # merge commit hash
follows_up:              # fix only: id of the intent whose change caused this defect, if known
links:
  - engineering-challenge.zip    the brief (README.md) and the four CSVs, as received
